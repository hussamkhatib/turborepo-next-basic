name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, synchronize]

jobs:
  build:
    name: Build and Test
    timeout-minutes: 15
    runs-on: ubuntu-latest
    # To use Remote Caching, uncomment the next lines and follow the steps below.
    # env:
    #  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
    #  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Link Vercel to GitHub Repository
        run: vercel link --repo --yes --scope=hussamshippercrmcs-projects --token=hpPssXCBC96EfioiTdlTkbgH
      # TESTING_TURBOREPO

      - name: Pull Vercel Environment Variables
        run:
          vercel env pull --environment=preview --token=hpPssXCBC96EfioiTdlTkbgH --cwd apps/web
          vercel env pull --environment=preview --token=hpPssXCBC96EfioiTdlTkbgH --cwd apps/docs

      - name: Print environment variables
        run: cat apps/web/.env
          cat apps/docs/.env

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm build
